# Podman Compose file for model-calling service
version: '3'

services:
  model-calling:
    container_name: model-calling
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/model-calling:latest
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - VLLM_BASE_URL=http://vllm:8000/v1
      - MODEL_CALLING_CONFIG=/config/model-calling.yaml
    # The directory, not the file: a single-file bind mount keeps the
    # original inode, so an editor's save (a new file renamed over the old
    # one) would never reach the container. Edits reload without a restart.
    volumes:
      - ./examples/config:/config:ro,z
    networks:
      - model-network
    depends_on:
      - ollama

  ollama:
    container_name: ollama
    image: docker.io/ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - model-network

networks:
  model-network:
    name: model-network

volumes:
  ollama_data:
    name: ollama_data
