[tox]
envlist = py311,py312,py313,py314
isolated_build = True

[testenv]
extras = dev
commands =
    pytest {posargs}

[testenv:lint]
deps =
    black
    flake8
    mypy
commands =
    black --check model_calling tests
    flake8 model_calling tests
    mypy model_calling

[testenv:format]
deps = black
commands = black model_calling tests

[testenv:docs]
deps =
    sphinx
    sphinx-rtd-theme
commands = sphinx-build -b html docs docs/_build
