[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-calling"
dynamic = ["version"]
description = "A unified API for calling multiple LLM providers through a consistent, OpenAI-compatible interface"
readme = { file = "PYPI_README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Wes Jackson" }]
requires-python = ">=3.11"
keywords = ["llm", "api", "ollama", "vllm", "openai", "anthropic", "ai", "language-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
moderation = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
]
examples = [
    "requests>=2.31.0",
    "aiohttp>=3.8.0",
    "numpy>=1.22.0",
    "scikit-learn>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/rdwj/model-calling"
Source = "https://github.com/rdwj/model-calling"
Issues = "https://github.com/rdwj/model-calling/issues"
Documentation = "https://github.com/rdwj/model-calling/tree/main/docs"

[project.scripts]
model-calling = "model_calling.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "model_calling.__version__" }

[tool.setuptools.packages.find]
include = ["model_calling*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "function_calling: tests that verify function calling capabilities",
]
asyncio_mode = "auto"
