[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-calling"
dynamic = ["version"]
description = "A unified API for calling multiple LLM providers through a consistent, OpenAI-compatible interface"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Wes Jackson" }]
requires-python = ">=3.11"
keywords = ["llm", "api", "ollama", "vllm", "openai", "anthropic", "ai", "language-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
# Every dependency is pinned to an exact version that was at least 7 days
# old and free of known CVEs when vetted. See "Dependency Policy" in
# CONTRIBUTING.md before changing any of these. The library needs only
# httpx and pydantic; the gateway is the `server` extra.
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
server = [
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
]
moderation = [
    "torch==2.14.1",
    "transformers==5.20.2",
]
examples = [
    "requests==2.34.2",
    "aiohttp==3.14.5",
    "numpy==2.4.6; python_version < '3.12'",
    "numpy==2.5.4; python_version >= '3.12'",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    # The offline suite exercises the gateway too.
    "model-calling[server]",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "black==26.10.1",
    "flake8==7.4.1",
    "pip-audit==2.10.1",
    "requests==2.34.2",
    "openai==3.35.1",
    "anthropic==2.0.0",
    # anthropic's httpx fork; the SDK grid builds its ASGI client with it.
    "httpx2==2.15.1",
]

[project.urls]
Homepage = "https://github.com/rdwj/model-calling"
Source = "https://github.com/rdwj/model-calling"
Issues = "https://github.com/rdwj/model-calling/issues"
Documentation = "https://github.com/rdwj/model-calling/tree/main/docs"

[project.scripts]
model-calling = "model_calling.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "model_calling.__version__" }

[tool.setuptools.packages.find]
include = ["model_calling*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Plain `pytest` is the offline suite. Select live tests explicitly with `-m live`.
addopts = '-v --strict-markers -m "not live and not acceptance"'
markers = [
    "live: calls OpenRouter, costs money, and appends to tests/live/spend.jsonl",
    "acceptance: drives Claude Code through the gateway on real backends (tests/acceptance)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "function_calling: tests that verify function calling capabilities",
]
asyncio_mode = "auto"

[tool.uv]
# Supply-chain rule: never resolve a release (direct or transitive) published
# after this timestamp. When updating dependencies, move it forward to no later
# than 7 days before the update, then re-run the audit.
exclude-newer = "2026-10-21T15:52:00Z"
